<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlideStrike.io | Web Multiplayer P2P</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0b0e; color: #fff; user-select: none;
        }
        #menu-container {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a24 0%, #07070a 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; transition: opacity 0.5s ease;
        }
        .panel {
            background: rgba(15, 15, 25, 0.9); padding: 40px; border-radius: 12px;
            border: 2px solid #00f3ff; box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            text-align: center; max-width: 400px; width: 90%;
        }
        h1 { margin-top: 0; color: #00f3ff; text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); letter-spacing: 2px; font-size: 28px; }
        input {
            width: 100%; padding: 12px; margin: 15px 0; border-radius: 6px; box-sizing: border-box;
            border: 1px solid #333; background: #12121a; color: #fff; font-size: 16px; text-align: center;
        }
        input:focus { border-color: #00f3ff; outline: none; }
        button {
            width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 6px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .btn-primary { background: #00f3ff; color: #000; }
        .btn-primary:hover { background: #00b8cc; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }
        .btn-secondary { background: #ff0055; color: #fff; }
        .btn-secondary:hover { background: #cc0044; box-shadow: 0 0 15px rgba(255, 0, 85, 0.4); }
        
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: none; z-index: 5;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            border: 2px solid #00f3ff; border-radius: 50%; transform: translate(-50%, -50%);
        }
        #hp-display {
            position: absolute; bottom: 30px; left: 30px; background: rgba(0,0,0,0.6);
            padding: 15px 25px; border-radius: 8px; border-left: 5px solid #ff0055;
            font-size: 24px; font-weight: bold;
        }
        #room-info {
            position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.6);
            padding: 10px 20px; border-radius: 6px; border: 1px solid #333; font-family: monospace;
        }
        #status-msg {
            color: #ff0055; font-size: 14px; margin-top: 10px; min-height: 20px; font-weight: bold;
        }
        #respawn-screen {
            position: absolute; width: 100%; height: 100%; background: rgba(255,0,0,0.4);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 8; pointer-events: none;
        }
        #respawn-screen h2 { font-size: 48px; text-shadow: 0 0 10px #000; color: #fff; margin: 0; }
    </style>
</head>
<body>

    <div id="menu-container">
        <div class="panel">
            <h1>SLIDESTRIKE.IO</h1>
            <input type="text" id="nickname" placeholder="Seu Nickname" maxlength="12" value="Player">
            <button class="btn-primary" id="btn-create">Criar Sala (Host)</button>
            <hr style="border: 0; border-top: 1px solid #222; margin: 20px 0;">
            <input type="text" id="room-code" placeholder="Código da Sala">
            <button class="btn-secondary" id="btn-join">Entrar na Sala</button>
            <div id="status-msg"></div>
        </div>
    </div>

    <div id="hud">
        <div id="crosshair"></div>
        <div id="hp-display">HP: <span id="hp-val">100</span></div>
        <div id="room-info">SALA: <span id="room-val">-</span></div>
    </div>

    <div id="respawn-screen">
        <h2>VOCÊ MORREU!</h2>
        <p>Ressurgindo em 3 segundos...</p>
    </div>

    <!-- Motores de Comunicação P2P e Renderização 3D hospedados em CDN públicos estáveis -->
    <script src="https://unpkg.com"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com",
                "three/addons/": "https://unpkg.com"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // Elementos DOM da Interface
        const menuContainer = document.getElementById('menu-container');
        const btnCreate = document.getElementById('btn-create');
        const btnJoin = document.getElementById('btn-join');
        const inputNick = document.getElementById('nickname');
        const inputRoom = document.getElementById('room-code');
        const hud = document.getElementById('hud');
        const roomVal = document.getElementById('room-val');
        const hpVal = document.getElementById('hp-val');
        const respawnScreen = document.getElementById('respawn-screen');
        const statusMsg = document.getElementById('status-msg');

        // Configurações de Estado e Rede
        let peer = null;
        let connections = {}; 
        let isHost = false;
        let myId = null;
        let myRoomCode = null;
        let enemies = {};
        let playerListData = {}; 

        // Criação e setup do ambiente Three.js
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.FogExp2(0x050508, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new PointerLockControls(camera, document.body);
        scene.add(controls.getObject());

        // Mecânicas Físicas e Variáveis de Input
        const moveState = { forward: false, backward: false, left: false, right: false };
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let myHp = 100;
        let isDead = false;

        // Atributos de Slide
        let isSliding = false;
        let slideTimer = 0;
        const slideDuration = 0.5; // meio segundo de boost
        let slideDirection = new THREE.Vector3();
        let normalHeight = 2.0;
        let slideHeight = 1.0;

        // Iluminação
        scene.add(new THREE.AmbientLight(0x222233));
        const dirLight = new THREE.DirectionalLight(0x00f3ff, 0.5);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // Chão em Grid Neon Estilo Cyberpunk
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x0a0a0f, roughness: 0.7 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(100, 50, 0x00f3ff, 0x111122);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // Estruturas de Obstáculo (Para cálculo dinâmico de Colisões)
        const boxGeo = new THREE.BoxGeometry(6, 8, 6);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x101018, metalness: 0.5, roughness: 0.2 });
        const obstaclePositions = [[-15, 4, 15], [15, 4, -20], [-20, 4, -20], [0, 4, 20]];
        const obstacleMeshes = [];

        obstaclePositions.forEach(pos => {
            const box = new THREE.Mesh(boxGeo, boxMat);
            box.position.set(...pos);
            scene.add(box);
            obstacleMeshes.push(box);
            
            const edges = new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo), new THREE.LineBasicMaterial({ color: 0x00f3ff }));
            edges.position.set(...pos);
            scene.add(edges);
        });

        resetPosition();

        function generateRoomID() {
            return "ROOM-" + Math.floor(1000 + Math.random() * 9000);
        }

        // --- PROTOCOLO DE REDE P2P (WEBRTC VIA PEERJS) ---
        function setupConnection(conn) {
            conn.on('data', (data) => {
                if (data.type === 'move') {
                    playerListData[data.id] = { x: data.x, y: data.y, z: data.z, nick: data.nick };
                    if (isHost) broadcast({ type: 'sync', players: playerListData }, conn.peer);
                    updateEnemies();
                } 
                else if (data.type === 'sync') {
                    playerListData = data.players;
                    updateEnemies();
                } 
                else if (data.type === 'hit' && data.targetId === myId) {
                    myHp -= 20;
                    hpVal.innerText = myHp;
                    if (myHp <= 0) die();
                }
                else if (data.type === 'laser') {
                    createLaserBeam(new THREE.Vector3(...data.start), new THREE.Vector3(...data.end));
                }
            });

            conn.on('close', () => {
                if (enemies[conn.peer]) {
                    scene.remove(enemies[conn.peer].mesh);
                    delete enemies[conn.peer];
                }
                delete connections[conn.peer];
                delete playerListData[conn.peer];
            });
        }

        function broadcast(data, ignoreId = null) {
            for (let id in connections) {
