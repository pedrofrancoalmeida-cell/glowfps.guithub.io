<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyRoyale.io</title>
    <link rel="stylesheet" href="style.css">
    <script src="game.js" defer></script>
</head>
<body>

    <div id="ui">
        <div class="hud-item">Vivos: <span id="alive-count">20</span></div>
        <div class="hud-item">Kills: <span id="kill-count">0</span></div>
        <div class="hud-item" style="border-left-color: #ef4444;">Vida: <span id="health-val">100</span></div>
        <div class="hud-item" style="border-left-color: #3b82f6;">Zona: <span id="zone-timer">Abaixando...</span></div>
    </div>

    <div id="kill-feed"></div>

    <div id="screen-msg">
        <h1 id="msg-title">VITÓRIA!</h1>
        <p id="msg-sub">Você é o último polígono de pé.</p>
        <button id="restartBtn">Jogar Novamente</button>
    </div>

    <canvas id="gameCanvas"></canvas>
</body>
</html>
